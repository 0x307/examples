[workspace]
resolver = "2"
members = [
    "01-pqc-digital-signatures",
    "02-pqc-key-exchange",
    "03-anonymous-agent-identity",
    "04-x402-vault-micropayments",
]

[workspace.package]
edition    = "2021"
license    = "MIT OR Apache-2.0"
repository = "https://github.com/0x307/examples"
publish    = false

[workspace.dependencies]
# Every example pins the exact published version a reader gets from
# `cargo add`. If a release breaks an example, CI fails here first.
pqc-sig      = "0.4.1"
pqc-kem      = "0.3.0"
aethel-sdk   = "0.8.0"
aethel-vault = "0.3.0"
rand         = "0.8"

# Must be the aethel-core that aethel-vault uses: `Identity` crosses between
# them, and two copies in the graph stop it unifying. aethel-vault 0.3 uses
# 0.7. (aethel-sdk runs aethel-core as an embedded component, so it is not
# part of this constraint.)
aethel-core  = "0.7.0"
